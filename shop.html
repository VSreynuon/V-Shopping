<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Shop | V-Shopping</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <div id="navbar"></div>
    <section class="page-header">
        <div class="container">
            <h1>Shop</h1>
            <p>Discover our latest fashion collection</p>
        </div>
    </section>
    <section class="section">
        <div class="container">
            <div class="shop-toolbar">
                <div><span id="productCount"></span></div>
                <div class="shop-actions"><input type="text" id="searchInput" class="form-control"
                        placeholder="Search products..."><select id="sortProducts" class="form-select">
                        <option value="">Sort By</option>
                        <option value="low">Price: Low to High</option>
                        <option value="high">Price: High to Low</option>
                        <option value="name">Name</option>
                    </select></div>
            </div>
            <div class="row">
                <div class="col-lg-3">
                    <div class="filter-box">
                        <h5>Categories</h5>
                        <div class="filter-list"><button onclick="filterCategory('All')">All Products</button><button
                                onclick="filterCategory('Women')">Women</button><button
                                onclick="filterCategory('Men')">Men</button><button
                                onclick="filterCategory('Accessories')">Accessories</button><button
                                onclick="filterCategory('Shoes')">Shoes</button></div>
                        <hr>
                        <h5>Price</h5><input type="range" id="priceRange" min="10" max="100" value="100"
                            class="form-range">
                        <p>Maximum: $<span id="priceValue">100</span></p>
                    </div>
                </div>
                <div class="col-lg-9">
                    <div class="row g-4" id="productList"></div>
                </div>
            </div>
        </div>
    </section>
    <div id="footer"></div>
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
