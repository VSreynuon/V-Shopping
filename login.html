<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login | V-Shopping</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="navbar"></div>
    <section class="auth-section">
        <div class="auth-box">
            <h2>Welcome Back</h2>
            <p>Login to your V-Shopping account</p>
            <form id="loginForm"><input type="email" id="loginEmail" class="form-control" placeholder="Email address"
                    required><input type="password" id="loginPassword" class="form-control" placeholder="Password"
                    required><button class="btn-main w-100">LOGIN</button></form>
            <p class="auth-bottom">Don't have an account? <a href="register.html">Create Account</a></p>
        </div>
    </section>
    <div id="footer"></div>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
