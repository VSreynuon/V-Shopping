<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Create Account | V-Shopping</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="navbar"></div>
    <section class="auth-section">
        <div class="auth-box">
            <h2>Create Account</h2>
            <p>Join V-Shopping today</p>
            <form id="registerForm"><input type="text" id="registerName" class="form-control" placeholder="Full name"
                    required><input type="email" id="registerEmail" class="form-control" placeholder="Email address"
                    required><input type="password" id="registerPassword" class="form-control" placeholder="Password"
                    required><input type="password" id="confirmPassword" class="form-control"
                    placeholder="Confirm password" required><button class="btn-main w-100">CREATE ACCOUNT</button>
            </form>
            <p class="auth-bottom">Already have an account? <a href="login.html">Login</a></p>
        </div>
    </section>
    <div id="footer"></div>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
