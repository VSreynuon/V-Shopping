<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Checkout | V-Shopping</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="navbar"></div>
    <section class="section">
        <div class="container">
            <h2 class="mb-4">Checkout</h2>
            <div class="row g-4">
                <div class="col-lg-7">
                    <div class="checkout-box">
                        <h5>Delivery Information</h5><input id="checkoutName" class="form-control"
                            placeholder="Full Name"><input id="checkoutPhone" class="form-control"
                            placeholder="Phone Number"><input id="checkoutAddress" class="form-control"
                            placeholder="Address"><input id="checkoutCity" class="form-control"
                            placeholder="City / Province">
                        <h5 class="mt-4">Payment Method</h5><select id="paymentMethod" class="form-select">
                            <option>Cash on Delivery</option>
                            <option>Credit / Debit Card</option>
                            <option>ABA / KHQR</option>
                        </select>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="summary-box">
                        <h5>Order Summary</h5>
                        <div id="checkoutSummary"></div><button onclick="placeOrder()" class="btn-main w-100 mt-4">PLACE
                            ORDER</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <div id="footer"></div>
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/checkout.js"></script>
</body>

</html>
